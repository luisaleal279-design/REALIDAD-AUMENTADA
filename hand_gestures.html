<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento de Gestos AR</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc;
            --bg-dark: #050505;
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(0, 255, 204, 0.3);
            --text: #ffffff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
        }

        .camera-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Efecto espejo */
            transform: scaleX(-1);
        }

        /* Capa de Interfaz sobre el video */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Título Principal */
        .header {
            margin-top: 30px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 15px 40px;
            border-radius: 50px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Visualizador de Gestos */
        .gesture-card {
            margin-top: auto;
            margin-bottom: 50px;
            background: rgba(10, 10, 15, 0.85);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 20px 50px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .gesture-card.active {
            transform: translateY(0);
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.8);
            background: rgba(0, 255, 204, 0.1);
        }

        .gesture-title {
            font-size: 1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            display: block;
        }

        .gesture-text {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text);
            margin: 0;
            text-shadow: 0 0 15px var(--primary);
        }

        /* Botón de Inicio */
        .btn-start {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            pointer-events: auto;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            transition: all 0.3s;
            z-index: 20;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .btn-start:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .btn-start.hidden {
            display: none;
        }

        #loading-text {
            position: absolute;
            top: calc(50% + 50px);
            left: 50%;
            transform: translateX(-50%);
            color: var(--primary);
            font-weight: 600;
            font-size: 1.2rem;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Contenedor del video y canvas -->
    <div class="camera-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- Capa Holográfica de Interfaz -->
    <div class="ui-layer">
        <div class="header">
            <h1>Scanner de Gestos AR</h1>
        </div>

        <div id="gesture-card" class="gesture-card">
            <span class="gesture-title">Gesto Detectado</span>
            <p id="gesture-text" class="gesture-text">Esperando...</p>
        </div>
    </div>

    <button id="start-btn" class="btn-start">Iniciar Cámara</button>
    <div id="loading-text">Cargando modelos de Inteligencia Artificial...</div>

    <!-- Script de la Aplicación -->
    <script type="module">
        import {
            GestureRecognizer,
            FilesetResolver,
            DrawingUtils
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        
        const startBtn = document.getElementById("start-btn");
        const loadingText = document.getElementById("loading-text");
        const gestureCard = document.getElementById("gesture-card");
        const gestureText = document.getElementById("gesture-text");

        let gestureRecognizer;
        let runningMode = "VIDEO";
        let webcamRunning = false;
        let lastVideoTime = -1;
        let drawingUtils;

        // Mapeo de gestos en inglés a español con emojis
        const gestureTranslations = {
            "None": "Ninguno",
            "Closed_Fist": "Puño Cerrado ✊",
            "Open_Palm": "Palma Abierta ✋",
            "Pointing_Up": "Apuntando Arriba ☝️",
            "Thumb_Down": "Pulgar Abajo 👎",
            "Thumb_Up": "Pulgar Arriba 👍",
            "Victory": "Victoria ✌️",
            "ILoveYou": "Te Quiero 🤟"
        };

        // 1. Inicializar el modelo
        async function initializeModel() {
            startBtn.style.display = "none";
            loadingText.style.display = "block";

            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                
                gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                        delegate: "GPU"
                    },
                    runningMode: runningMode,
                    numHands: 2
                });

                loadingText.style.display = "none";
                startCamera();
            } catch (error) {
                console.error("Error cargando el modelo:", error);
                loadingText.innerText = "Error cargando la Inteligencia Artificial.";
                loadingText.style.color = "#ff3366";
            }
        }

        // 2. Iniciar la cámara
        function startCamera() {
            const constraints = { video: { facingMode: "user", width: 1280, height: 720 } };
            
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    webcamRunning = true;
                    drawingUtils = new DrawingUtils(canvasCtx);
                    predictWebcam();
                });
            }).catch((err) => {
                console.error("Error accediendo a la cámara:", err);
                alert("Por favor, permite el acceso a la cámara.");
            });
        }

        // 3. Bucle de predicción y dibujado
        async function predictWebcam() {
            if (!webcamRunning) return;

            // Sincronizar el canvas con la resolución real del video
            if (canvasElement.width !== video.videoWidth) {
                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;
            }

            let nowInMs = Date.now();
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                // Ejecutar reconocimiento de gestos
                const results = gestureRecognizer.recognizeForVideo(video, nowInMs);

                // Limpiar el frame anterior
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                if (results.landmarks && results.landmarks.length > 0) {
                    // Dibujar el esqueleto de las manos detectadas
                    for (const landmarks of results.landmarks) {
                        drawingUtils.drawConnectors(
                            landmarks,
                            GestureRecognizer.HAND_CONNECTIONS,
                            { color: "#00ffcc", lineWidth: 4 }
                        );
                        drawingUtils.drawLandmarks(landmarks, {
                            color: "#ffffff",
                            lineWidth: 2,
                            radius: 4
                        });
                    }

                    // Actualizar el texto del gesto
                    if (results.gestures.length > 0) {
                        const categoryName = results.gestures[0][0].categoryName;
                        const translatedName = gestureTranslations[categoryName] || categoryName;
                        
                        gestureText.innerText = translatedName;
                        
                        if (categoryName !== "None") {
                            gestureCard.classList.add("active");
                        } else {
                            gestureCard.classList.remove("active");
                            gestureText.innerText = "Mano Detectada (Sin Gesto)";
                        }
                    }
                } else {
                    // No hay manos en la pantalla
                    gestureCard.classList.remove("active");
                    gestureText.innerText = "Esperando mano...";
                }
                
                canvasCtx.restore();
            }

            // Llamar al siguiente frame
            window.requestAnimationFrame(predictWebcam);
        }

        // Asignar evento al botón principal
        startBtn.addEventListener("click", initializeModel);

    </script>
</body>
</html>
